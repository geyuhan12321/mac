name: build-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      onefile:
        description: "打成单个 exe（启动稍慢）"
        type: boolean
        default: false

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: 自检（读真实词库）
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -c @"
          import json, os
          from PySide6.QtWidgets import QApplication
          import dictionary_model, dictionary_render
          repo = json.load(open('data/words.json', encoding='utf-8'))
          app = QApplication([])
          entries = [dictionary_model.normalize_entry(x) for x in repo[:50]]
          idx = dictionary_model.Index(entries)
          html = dictionary_render.entry_html(entries[0], idx, [], [])
          assert len(html) > 200
          imgs = sum(1 for e in repo if e.get('images'))
          print(f'self-check ok: 词库 {len(repo)} 条（{imgs} 条带图），渲染 {len(html)} 字符')
          "@

      - name: 检查数据是否齐全
        run: |
          if (-not (Test-Path data/words.json)) { throw "缺少 data/words.json" }
          $n = (Get-ChildItem data/images/*.jpg -ErrorAction SilentlyContinue).Count
          Write-Host "字源图 $n 张"
          if ($n -eq 0) { Write-Warning "没有图片" }

      - name: PyInstaller 打包
        env:
          APP_NAME: ${{ vars.WIN_APP_NAME || 'Dict' }}
        run: |
          $mode = if ('${{ inputs.onefile }}' -eq 'true') { '--onefile' } else { '--onedir' }
          python -m PyInstaller `
            --noconfirm --clean --windowed $mode `
            --name "$env:APP_NAME" `
            --exclude-module PySide6.QtWebEngineCore `
            --exclude-module PySide6.QtWebEngineWidgets `
            --exclude-module PySide6.Qt3DCore `
            --exclude-module PySide6.QtMultimedia `
            --exclude-module tkinter `
            --add-data "data/words.json;data" `
            --add-data "data/images;data/images" `
            app.py

      - name: 检查产物大小
        env:
          APP_NAME: ${{ vars.WIN_APP_NAME || 'Dict' }}
        run: |
          Get-ChildItem dist -Recurse -File | Measure-Object -Property Length -Sum |
            ForEach-Object { "产物合计 {0:N1} MB" -f ($_.Sum / 1MB) }

      - name: 压缩
        env:
          APP_NAME: ${{ vars.WIN_APP_NAME || 'Dict' }}
        run: |
          Compress-Archive -Path "dist/$env:APP_NAME" -DestinationPath "dist/$env:APP_NAME-windows-x64.zip" -Force
          $zip = Get-Item "dist/$env:APP_NAME-windows-x64.zip"
          Write-Host ("压缩包 {0:N1} MB" -f ($zip.Length / 1MB))
          if ($zip.Length -lt 50MB) { throw "压缩包过小，可能没打进数据" }

      - uses: actions/upload-artifact@v4
        with:
          name: Windows x64
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: 发布到 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
